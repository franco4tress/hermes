[package]
name = "hermes"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m     = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt  = "0.7"
stm32h7xx-hal = { version = "0.16", features = ["stm32h753v", "rt"] }
embedded-hal = "0.2"
panic-halt   = "0.2"
rtt-target = { version = "0.3", features = ["cortex-m"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
debug         = true

[profile.dev]
opt-level = 1
debug     = true
